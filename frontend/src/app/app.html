<main class="container">
  <h1>Matrículas Acadêmicas</h1>

  <section class="card">
    <h2>Cadastrar aluno</h2>

    <form (ngSubmit)="criarAluno()">
      <div class="form-group">
        <label for="aluno-nome">Nome</label>
        <input
          id="aluno-nome"
          name="aluno-nome"
          type="text"
          [(ngModel)]="novoAluno.nome"
        >
      </div>

      <div class="form-group">
        <label for="aluno-email">E-mail</label>
        <input
          id="aluno-email"
          name="aluno-email"
          type="email"
          [(ngModel)]="novoAluno.email"
        >
      </div>

      <button type="submit">Cadastrar aluno</button>
    </form>

    <p *ngIf="mensagem" class="success">{{ mensagem }}</p>
    <p *ngIf="erro" class="error">{{ erro }}</p>
  </section>

  <section class="card">
    <h2>Alunos cadastrados</h2>

    <p *ngIf="alunos.length === 0">Nenhum aluno cadastrado.</p>

    <table *ngIf="alunos.length > 0">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>E-mail</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let aluno of alunos">
          <td>{{ aluno.id }}</td>
          <td>{{ aluno.nome }}</td>
          <td>{{ aluno.email }}</td>
        </tr>
      </tbody>
    </table>
  </section>
</main>
